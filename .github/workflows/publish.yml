name: Publish

on:
  push:
    tags: ["v*"]

# The repository default for GITHUB_TOKEN is read-only, so any job needing to
# write must ask for it explicitly. Without this the release job retried a 403
# until it failed ("Too many retries") while the binaries built fine — the token
# had no permission to create a release.
permissions:
  contents: read

jobs:
  binaries:
    name: Build binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: b4mal-linux-x64
            compile-target: bun-linux-x64
          - os: ubuntu-latest
            target: b4mal-linux-arm64
            compile-target: bun-linux-arm64
          - os: macos-latest
            target: b4mal-macos-x64
            compile-target: bun-darwin-x64
          - os: macos-latest
            target: b4mal-macos-arm64
            compile-target: bun-darwin-arm64
          # Windows was the gap that made "one binary, no runtime install" untrue
          # on that platform: npm install needs Bun present, and there was no
          # release artifact. Compiled from ubuntu — Bun cross-compiles the
          # windows target, so no windows runner is needed to build it.
          - os: ubuntu-latest
            target: b4mal-windows-x64.exe
            compile-target: bun-windows-x64
            windows: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Compile binary
        run: bun build --compile --target=${{ matrix.compile-target }} src/cli/index.ts --outfile dist/${{ matrix.target }}

      # Cross-compiled windows executables are easy to produce and easy to
      # produce wrong. A PE file starts with "MZ"; checking it here means a
      # truncated or mis-targeted upload fails the build instead of shipping.
      - name: Verify the windows executable
        if: matrix.windows == 'true'
        shell: bash
        run: |
          file="dist/${{ matrix.target }}"
          head -c 2 "$file" | grep -q 'MZ' || {
            echo "::error::$file is not a PE executable"
            exit 1
          }
          size=$(wc -c < "$file" | tr -d ' ')
          echo "PE executable verified ($size bytes)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # `npm publish` triggers prepublishOnly ("bun run build && bun test"),
      # which runs the full test suite. Without dependencies installed that
      # suite cannot resolve zod/js-yaml/etc., so the publish aborts.
      - run: bun install

      # A tag push is not always the first publish of that version. npm rejects
      # a duplicate version outright ("cannot publish over the previously
      # published versions"), which would fail this job and hide the fact that
      # the binaries and the GitHub Release were built successfully alongside it.
      # 0.1.1 is exactly that case: it was published from a workstation, so the
      # tag push must still be able to produce the release assets.
      - name: Check whether this version is already on npm
        id: published
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${PKG}@${VER} is already published — skipping npm publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Publishing to npm needs a token. If the secret is not configured, warn and
      # skip rather than failing the job: the GitHub Release is produced by a
      # separate job that depends only on `binaries`, so a missing token would
      # otherwise red the whole workflow while the release still succeeded.
      # The warning is loud on purpose — a release without its npm package is
      # easy to miss.
      - name: Check for an npm token
        id: token
        if: steps.published.outputs.already != 'true'
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not configured — skipping npm publish. Run 'npm publish' from an authenticated machine to finish the release."
            echo "npm publish skipped: NPM_TOKEN not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already != 'true' && steps.token.outputs.present == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    # Least privilege: only this job needs to write, and only to contents.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: b4mal-*
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/b4mal-*
          generate_release_notes: true
