name: Publish

on:
  push:
    tags: ["v*"]

# The repository default for GITHUB_TOKEN is read-only, so any job needing to
# write must ask for it explicitly. Without this the release job retried a 403
# until it failed ("Too many retries") while the binaries built fine — the token
# had no permission to create a release.
permissions:
  contents: read

jobs:
  binaries:
    name: Build binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: b4mal-linux-x64
            compile-target: bun-linux-x64
          - os: ubuntu-latest
            target: b4mal-linux-arm64
            compile-target: bun-linux-arm64
          - os: macos-latest
            target: b4mal-macos-x64
            compile-target: bun-darwin-x64
          - os: macos-latest
            target: b4mal-macos-arm64
            compile-target: bun-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Compile binary
        run: bun build --compile --target=${{ matrix.compile-target }} src/cli/index.ts --outfile dist/${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # `npm publish` triggers prepublishOnly ("bun run build && bun test"),
      # which runs the full test suite. Without dependencies installed that
      # suite cannot resolve zod/js-yaml/etc., so the publish aborts.
      - run: bun install

      # A tag push is not always the first publish of that version. npm rejects
      # a duplicate version outright ("cannot publish over the previously
      # published versions"), which would fail this job and hide the fact that
      # the binaries and the GitHub Release were built successfully alongside it.
      # 0.1.1 is exactly that case: it was published from a workstation, so the
      # tag push must still be able to produce the release assets.
      - name: Check whether this version is already on npm
        id: published
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${PKG}@${VER} is already published — skipping npm publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    # Least privilege: only this job needs to write, and only to contents.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: b4mal-*
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/b4mal-*
          generate_release_notes: true
