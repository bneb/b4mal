name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogfood:
    name: Dogfood (typecheck → test → build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build (dogfood)
        run: bun run src/cli/index.ts build

  init-test:
    name: Init test (20 repos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bash scripts/test-init.sh

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      # The claim audit (tests/docs_claims.test.ts) runs as part of the Dogfood
      # job's `bun test`. This job catches what that cannot: broken frontmatter,
      # invalid containers and dead internal routes, which only fail at render.
      - run: bun run docs:build
