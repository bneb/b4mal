name: B4mal CI

# Auto-generated by B4mal (The CI Emitter)
# 
# This workflow runs your entire DAG natively on a single VM.
# B4mal's internal WavePlanner handles multi-process concurrency,
# completely avoiding GHA VM provisioning limits and artifact network latency.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: B4mal Orchestrator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install B4mal
        run: npm i -g b4mal # Or via shell script if preferred

      - name: Restore B4mal Global Cache
        uses: actions/cache@v3
        with:
          path: .b4mal/
          # Hashing the lockfile ensures safe caching boundary
          key: ${{ runner.os }}-b4mal-${{ hashFiles('b4mal.lock') }}
          restore-keys: |
            ${{ runner.os }}-b4mal-

      - name: Execute Verified DAG
        run: b4mal build
