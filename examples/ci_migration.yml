# b4mal CI Pipeline — Complex Example
# This demonstrates a realistic multi-stage build with nested dependencies,
# parameterized values, and composite run commands.

key: fullstack-ci
values:
  node-version: "20"
  registry: "ghcr.io/acme"
  deploy-env: "staging"

tasks:
  - key: install-deps
    run: npm ci --frozen-lockfile
    env:
      NODE_ENV: development
      NPM_TOKEN: ${{ values.registry }}/token

  - key: lint
    run: npm run lint
    after:
      - install-deps

  - key: typecheck
    run: npx tsc --noEmit
    after:
      - install-deps

  - key: unit-tests
    run: npm test -- --coverage && npm run test:integration
    after:
      - lint
      - typecheck
    env:
      CI: "true"
      NODE_VERSION: ${{ values.node-version }}

  - key: build-frontend
    run: npm run build:fe
    after:
      - unit-tests

  - key: build-backend
    run: npm run build:be
    after:
      - unit-tests

  - key: docker-build
    run: docker build -t ${{ values.registry }}/app:latest .
    after:
      - build-frontend
      - build-backend
    env:
      DOCKER_BUILDKIT: "1"

  - key: e2e-tests
    run: npx playwright test
    after:
      - docker-build
    env:
      E2E_BASE_URL: http://localhost:3000
      DEPLOY_ENV: ${{ values.deploy-env }}

  - key: deploy
    run: kubectl apply -f k8s/
    after:
      - e2e-tests
    env:
      KUBECONFIG: /home/runner/.kube/config
